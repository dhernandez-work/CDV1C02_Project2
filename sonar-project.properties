# ==============================================================================
# SonarQube Project Configuration
# ==============================================================================

# Required: Unique project identifier and organization from SonarQube Cloud
sonar.projectKey=dhernandez-work_CDV1C02_Project2
sonar.organization=dhernandez-work

# Python Version & Directories
sonar.python.version=3.9
sonar.sources=src,app.py
sonar.tests=tests

# ------------------------------------------------------------------------------
# Coverage Configuration
# ------------------------------------------------------------------------------
# Location of the XML coverage report generated by pytest-cov
sonar.python.coverage.reportPaths=reports/coverage.xml

# Exclude entry point scripts from coverage calculations so domain logic is evaluated
sonar.coverage.exclusions=app.py